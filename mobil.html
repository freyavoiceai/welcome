<!doctype html>
<html lang="tr">
<head>
<title>Welcome to Freya</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a horizontal film strip. Full-bleed YC frame -> month columns interleaved with photo frames (photo + Getty-style caption beside it) -> legends, logo wall, quotes, end card. Click right half = forward, left half = back. Bottom bar is a month timeline. */
:root{
  --void:#0b0a09;
  --stage:#171412;
  --panel:#211c18;
  --ink:#f4efe9;
  --dim:#a59c93;
  --faint:#6e665f;
  --line:#2d2723;
  --accent:#ff6b1a;
  --accent-deep:#5a2208;
  --f-display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bar:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.slab{background:var(--accent);color:var(--void);font-family:var(--f-display);line-height:1;letter-spacing:.02em;padding:.06em .22em .04em;display:inline-block}

/* ---------- STRIP ---------- */
.strip{position:absolute;inset:0 0 calc(var(--bar) + env(safe-area-inset-bottom,0px)) 0;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;cursor:e-resize}
.strip.back{cursor:w-resize}
.strip::-webkit-scrollbar{display:none}
.frame{flex:0 0 auto;height:100%;position:relative;border-right:1px solid var(--line);margin:0}
.frame.pad{padding-block:clamp(20px,4vh,44px);padding-inline:clamp(20px,3vw,40px);overflow:hidden}
.frame:first-child{padding-left:max(0px,env(safe-area-inset-left,0px))}

/* hero */
.hero{width:100vw;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,9,.92) 0%,rgba(11,10,9,.55) 45%,rgba(11,10,9,.08) 75%),linear-gradient(0deg,rgba(11,10,9,.85),transparent 45%)}
.hero-copy{position:absolute;z-index:2;left:max(24px,env(safe-area-inset-left,0px),4vw);right:24px;bottom:clamp(24px,6vh,64px);display:grid;gap:18px;max-width:680px}
.hero h1{margin:0}
.hero h1 .slab{font-size:clamp(3.6rem,12vw,8.5rem)}
.hero p{margin:0;color:#ddd5ce;font-size:1.08rem;max-width:52ch}
.stat{justify-self:start;border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--f-label);font-size:.95rem;color:var(--dim);margin-top:6px}
.swipe{position:absolute;z-index:2;right:max(24px,env(safe-area-inset-right,0px));top:clamp(20px,5vh,48px);font-family:var(--f-label);font-weight:700;letter-spacing:.25em;text-transform:uppercase;font-size:.95rem;display:flex;gap:10px;align-items:center}
.swipe i{display:inline-block;width:46px;height:2px;background:var(--accent);position:relative;animation:nudge 1.6s ease-in-out infinite}
.swipe i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--accent);border-right:0}
@keyframes nudge{50%{transform:translateX(8px)}}

/* Getty-style caption */
.gcap{font-family:var(--f-body);font-size:.85rem;line-height:1.45;color:#d8d0c8}
.gcap .when{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.gcap .ltr{font-family:var(--f-label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-size:.82rem}
.gcap .names{color:var(--ink);font-weight:600}
.gcap .credit{font-family:var(--f-mono);font-size:.66rem;color:var(--faint)}
.hero .gcap{position:absolute;z-index:2;right:max(24px,env(safe-area-inset-right,0px));bottom:clamp(24px,6vh,64px);max-width:300px;text-align:right;background:rgba(11,10,9,.72);padding:10px 14px;border-right:3px solid var(--accent);display:grid;gap:3px}
@media (max-width:760px){.hero .gcap{top:clamp(64px,10vh,90px);bottom:auto}}

/* chapter card */
.chapter{width:min(78vw,320px);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;background:linear-gradient(180deg,var(--void),var(--accent-deep))}
.chapter .yr{font-family:var(--f-display);font-size:clamp(5rem,16vh,9rem);line-height:.85}
.chapter p{margin:0;color:#ead9cc;max-width:28ch}
.chapter .topic{font-family:var(--f-display);font-size:clamp(2.4rem,7vh,3.8rem);line-height:.95;text-wrap:balance}

.chapter:has(.lead){width:min(88vw,420px)}
.chapter .lead{display:grid;gap:12px;margin-top:14px}
.chapter .lead .card{background:rgba(11,10,9,.55)}
.chapter .lead h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1;text-wrap:balance}
.chapter{flex-direction:row;align-items:stretch;gap:clamp(20px,3vw,40px)}
.chapter .txt{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-width:0;flex:1}
.chapter.has-side{width:auto}
.chapter.has-side .txt{flex:0 0 min(78vw,400px)}
.chapter .side-img{flex:0 0 auto;display:flex;align-items:center;margin-block:calc(-1*clamp(20px,4vh,44px));margin-left:calc(-1*clamp(20px,3vw,40px))}
.chapter .side-img img{display:block;height:100%;width:auto;max-width:42vw;object-fit:cover}
.chapter .side-img.small{margin:0}
.chapter .side-img.small img{height:auto;max-height:78%;max-width:34vw;box-shadow:0 24px 60px rgba(0,0,0,.55)}
/* caption written on the picture, like the opening frame */
.ov{position:relative}
.ovcap{position:absolute;z-index:2;right:max(24px,env(safe-area-inset-right,0px));bottom:clamp(24px,5vh,48px);max-width:320px;text-align:right;background:rgba(11,10,9,.72);padding:10px 14px;border-right:3px solid var(--accent);display:grid;gap:3px}
.story .poster{height:100%;flex:0 0 auto;background:#000}
.story .poster img{display:block;height:100%;width:auto;max-width:48vw;object-fit:contain}
/* whole: never crop, show the full image */
.photo.whole .pic{padding:0 clamp(12px,2vw,24px)}
.photo.whole .pic img{height:auto;max-height:100%;width:auto;max-width:92vw;object-fit:contain}
.lead-logo{width:100%;height:clamp(64px,10vh,96px);padding:12px 22px;justify-content:flex-start}
.lead-logo img{max-height:100%}
.ovcap .ovt{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.05;color:var(--ink)}
.ovcap{max-width:380px}
.yt-quote{font-family:var(--f-display);font-size:clamp(1.4rem,3vh,2rem);line-height:1.1;color:var(--accent);text-decoration:none;border-bottom:2px solid var(--accent);justify-self:start}
.yt-quote:hover{color:var(--ink);border-color:var(--ink)}
.yt{aspect-ratio:16/9;width:100%;background:#000}
.yt iframe{width:100%;height:100%;border:0;display:block}
.sector header h2{font-size:clamp(2.6rem,7vh,3.8rem)}
.wall-frame header{flex:0 0 auto;border-bottom:1px solid var(--line);padding-bottom:10px}
.wall-frame h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,7vh,3.8rem);line-height:1}
.chapter.dark-ch{background:var(--void)}
.chapter .lead-text{margin:0;color:#ead9cc;max-width:40ch;line-height:1.5}
/* press: NTV on top, two news clippings side by side under it; frame width follows the NTV image so no empty bands */
.photo.press{--A:calc(100svh - var(--bar) - env(safe-area-inset-bottom,0px));--H:calc((var(--A) - 6px)/1.31);flex-direction:column;width:calc(var(--H)*1.838);padding:0;gap:6px;background:var(--void)}
.photo.whole.press .pic{flex:0 0 var(--H);height:var(--H);padding:0;background:#000}
.photo.whole.press .pic img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.photo.press .press-row{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.photo.press .press-row img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
/* month column */
.month{display:flex;flex-direction:column;gap:14px;background:var(--void)}
.month .cols{flex:1;min-height:0;display:flex;gap:14px;align-items:flex-start}
.month .col{width:min(80vw,340px);display:flex;flex-direction:column;gap:14px}
.month header{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.month h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1}
.month header small{font-family:var(--f-mono);font-size:.75rem;color:var(--dim)}
.card{background:var(--stage);border-top:2px solid var(--line);padding:14px 14px 12px;display:grid;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .d{font-family:var(--f-mono);font-size:.74rem;color:var(--dim);font-variant-numeric:tabular-nums}
.card .m{font-family:var(--f-display);font-size:1.6rem;line-height:1;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.card .who{display:flex;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;color:var(--dim)}
.card .t{font-weight:500;line-height:1.4}
.card .src{font-family:var(--f-mono);font-size:.68rem;color:var(--faint);word-break:break-word}

/* brand card: one per company, big logo, one orange headline */
.card.brand{gap:10px;padding:18px 18px 14px;border-top:2px solid var(--accent)}
.card.brand .logo.big{width:100%;height:72px;padding:10px 16px;justify-content:flex-start}
.card.brand .logo.big img{max-height:52px}
.card.brand .bname{font-family:var(--f-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--dim)}
.card.brand .bm{font-family:var(--f-display);font-size:clamp(1.8rem,4.4vh,2.4rem);line-height:1;color:var(--accent)}
/* logos */
.logo{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 24px rgba(0,0,0,.25);padding:6px 9px;flex:0 0 auto}
.logo.dark{background:#1b2a4a}
.logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.card .logo{width:74px;height:34px;padding:4px 7px}

/* photo frame: picture with caption column beside it */
/* story: title + cards (+ caption of its photo) on the left, the photo right next to it */
.story{display:flex;background:var(--void)}
.story .panel{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;padding:clamp(20px,4vh,44px) clamp(18px,2.4vw,30px);border-right:1px solid var(--line);overflow:hidden}
.panel .cols{flex:1;min-height:0;display:flex;gap:14px;align-items:flex-start}
.panel .col{width:min(80vw,340px);display:flex;flex-direction:column;gap:14px}
.panel header{flex:0 0 auto;border-bottom:1px solid var(--line);padding-bottom:10px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1;text-wrap:balance}
.capblock{display:grid;gap:6px;padding-top:2px}
.story .pic,.photo .pic{height:100%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#000}
.story .pic img{display:block;height:100%;width:auto;max-width:min(68vw,1400px);object-fit:cover}
/* matted: smaller photo framed on the dark wall, for low-res or very close-up images */
.mat .pic{background:var(--void);padding:clamp(28px,8vh,88px) clamp(24px,4vw,56px)}
.mat .pic img{height:auto!important;max-height:100%;max-width:min(56vw,820px)!important;object-fit:contain!important;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.white .pic{background:#fff;padding:clamp(16px,3vh,32px) clamp(16px,2vw,32px)}
.white .pic img{width:min(72vw,1500px);height:100%!important;max-width:none!important;object-fit:contain!important}
.photo{display:flex;background:#000}
.photo .pic img{display:block;height:100%;width:auto;max-width:min(68vw,1400px);object-fit:cover}
.photo.contain .pic{padding:clamp(16px,3vh,32px)}
.photo.contain .pic img{object-fit:contain;max-height:100%;height:auto;max-width:min(60vw,900px)}
.photo figcaption{width:min(340px,80vw);flex:0 0 auto;padding:clamp(20px,4vh,40px) clamp(18px,2.4vw,30px);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;background:var(--void);border-left:1px solid var(--line);overflow:hidden}
.photo h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1;text-wrap:balance}
@media (max-width:760px){
  .photo .pic img{max-width:none}
  .photo.contain .pic img{max-width:90vw}
  .photo figcaption{font-size:.8rem}
}

/* legends */
.legends-frame{display:flex;flex-direction:column;gap:18px}
.sec-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,6vh,3.8rem);line-height:1}
.legends{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:min(78vw,300px);gap:14px;align-content:start}
@media (max-height:640px){.legends{grid-template-rows:auto}}
.plaque{position:relative;background:linear-gradient(180deg,var(--stage),var(--void));border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;transition:transform .25s ease,border-color .25s ease}
.plaque:hover{transform:translateY(-3px);border-color:var(--accent)}
.plaque .no{position:absolute;right:12px;top:4px;font-family:var(--f-display);font-size:3.6rem;line-height:1;color:var(--line)}
.plaque .logo{height:46px;width:150px;align-self:flex-start}
.plaque .metric{font-family:var(--f-display);font-size:clamp(2rem,4vw,2.8rem);line-height:1;color:var(--accent)}
.plaque h4{margin:0;font-weight:600;font-size:1rem;line-height:1.35}
.plaque .meta{margin-top:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--dim)}

/* wall */
.wall-frame{display:flex;flex-direction:column;gap:18px}
.wall-groups{flex:1;min-height:0;display:flex;gap:clamp(24px,3vw,44px)}
.wg{display:flex;flex-direction:column;gap:12px;min-height:0}
.wg h3{margin:0;font-family:var(--f-label);font-weight:700;font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:8px}
.wall{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-columns:clamp(200px,28vh,300px);gap:14px}
@media (max-height:640px){.wall{grid-template-rows:repeat(2,minmax(0,1fr))}}
.wall .logo{height:100%;width:100%;padding:clamp(12px,2.4vh,26px) clamp(16px,2vw,30px);transition:transform .2s ease}
.wall .logo:hover{transform:scale(1.04)}

/* quotes */
.quotes-frame{display:flex;flex-direction:column;gap:18px}
.qrow{display:flex;gap:18px;align-items:flex-start}
.quote{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;background:var(--stage);border:1px solid var(--line);padding:22px;margin:0;width:min(84vw,460px)}
.quote img.face{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
.quote blockquote{margin:0;font-size:1.05rem;line-height:1.55}
.quote cite{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-style:normal;font-family:var(--f-label);font-size:1rem;color:var(--dim)}
.quote cite b{color:var(--ink)}
.quote cite .logo{height:32px;width:88px}
@media (max-width:520px){.quote{grid-template-columns:1fr}}

/* end card */
.end{width:min(88vw,520px);display:flex;flex-direction:column;justify-content:center;gap:18px;background:radial-gradient(80% 60% at 30% 40%,rgba(255,107,26,.2),transparent)}
.end .slab{font-size:clamp(3rem,10vw,5.5rem);align-self:flex-start}
.end p{margin:0;color:var(--dim)}
.end code{font-family:var(--f-mono);font-size:.78rem;color:var(--ink)}

/* ---------- BOTTOM BAR: month timeline ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--void);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;z-index:20}
.bar > button{background:transparent;border:1px solid var(--line);color:var(--ink);width:38px;height:34px;cursor:pointer;font-size:1.1rem;flex:0 0 auto}
.bar > button:hover{border-color:var(--accent)}
.tl{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:stretch}
.tl::before{content:"";position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line)}
.tl .fill{position:absolute;left:0;top:22px;height:2px;background:var(--accent);width:0;transition:width .15s linear}
.tl ol{position:relative;list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;width:100%}
.tl li{flex:1 1 0;display:flex;justify-content:center;min-width:0}
.tl button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:16px;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.82rem;color:var(--dim);white-space:nowrap}
.tl button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--void);border:2px solid var(--faint);transition:all .2s ease}
.tl button:hover{color:var(--ink)}
.tl button:hover::before{border-color:var(--ink)}
.tl button.past::before{background:var(--accent);border-color:var(--accent)}
.tl button.on{color:var(--accent)}
.tl button.on::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,107,26,.25)}
.tl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
  .bar > button{display:none}
  .tl button{font-size:.66rem;letter-spacing:.02em}
}

@media (prefers-reduced-motion:reduce){
  .swipe i,.plaque{animation:none;transition:none}
}

/* ---------- TEAM ---------- */
.team-ch{background:linear-gradient(180deg,var(--void),var(--accent-deep))}
.team{display:flex;flex-direction:column;gap:14px}
.team header h2{margin:0}
.team-grid{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));grid-template-columns:repeat(9,clamp(170px,15vw,230px));gap:14px;flex:1;min-height:0}
.tm{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:0}
.tm .ph{flex:1;min-height:0;overflow:hidden;background:var(--stage)}
.tm .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;filter:grayscale(1) contrast(1.05);transition:filter .45s ease,transform .6s ease}
.tm:hover .ph img{filter:none;transform:scale(1.03)}
.tm .meta{padding:10px 12px 12px;display:grid;gap:4px}
.tm .nm{font-family:var(--f-label);font-weight:700;font-size:1.15rem;letter-spacing:.02em;line-height:1.1}
.tm .ttl{font-family:var(--f-label);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);line-height:1.25}
.tm .row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.tm button.ab{all:unset;cursor:pointer;font-family:var(--f-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--accent)}
.tm a.li{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;color:var(--dim);border:1px solid var(--line)}
.tm a.li:hover{color:var(--void);background:var(--accent);border-color:var(--accent)}
.tm .ov{position:absolute;inset:0;background:var(--void);padding:16px 14px 12px;font-size:.88rem;line-height:1.5;color:var(--ink);display:none;flex-direction:column;gap:10px}
.tm.open .ov{display:flex}
.tm .ov p{margin:0;flex:1;min-height:0;overflow:auto}
.tm .ov .x{flex:none}

/* confidentiality */

.conf-note{font-family:var(--f-body);font-size:.7rem;letter-spacing:.02em;color:#8a827b;white-space:nowrap;font-weight:400}
.end .fine{margin-top:auto;font-size:.72rem;line-height:1.55;color:var(--faint);max-width:52ch;border-top:1px solid var(--line);padding-top:14px}
.end .fine b{color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem}
.end{justify-content:space-between}
.end .cont{display:flex;flex-direction:column;gap:18px}
.end .fine{margin-top:0!important}
.end .welcome-line{margin:0;font-family:var(--f-display);font-size:clamp(2rem,5vh,2.8rem);line-height:1;color:var(--accent)}
.card .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- PHONE VERSION: one column, scrolls down ---------- */
:root{--bar:58px}
html,body{height:auto}
body{overflow-x:hidden;overflow-y:auto;font-size:16px;-webkit-text-size-adjust:100%}
html{scroll-behavior:smooth}
.strip{position:static;display:block;overflow:visible;cursor:auto;padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px))}
.frame{display:block;width:100%!important;height:auto;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
.frame.pad{padding:44px 20px 36px;overflow:visible}

/* hero: photo on top, text under it */
.hero{min-height:calc(100svh - var(--bar));display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 28px}
.hero img{height:64svh;bottom:auto;object-position:43% 30%}
.hero::after{background:linear-gradient(0deg,var(--void) 36svh,rgba(11,10,9,.55) 46svh,rgba(11,10,9,0) 60svh)}
.hero-copy{position:relative;left:auto;right:auto;bottom:auto;padding:0 20px;gap:14px}
.hero h1 .slab{font-size:clamp(4rem,22vw,6rem)}
.hero p{font-size:1.05rem}
.hero .gcap{top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:auto;bottom:auto;max-width:72vw;text-align:left;border-right:0;border-left:3px solid var(--accent);padding:8px 12px}
.swipe{order:2;position:relative;top:auto;right:auto;align-self:center;margin-top:24px;font-size:.8rem;color:var(--dim)}
.swipe i{width:2px;height:26px;animation:nudgeY 1.6s ease-in-out infinite}
.swipe i::after{right:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
@keyframes nudgeY{50%{transform:translateY(6px)}}

/* month opener */
.chapter{display:flex;flex-direction:column;gap:18px;min-height:0;background:linear-gradient(180deg,var(--void) 0%,var(--accent-deep) 100%)}
.chapter.dark-ch{background:var(--void)}
.chapter .txt{gap:10px}
.chapter .topic{font-size:clamp(3.4rem,17vw,5rem)}
.chapter .lead{max-width:none;margin-top:10px}
.chapter .lead h3{font-size:2rem}
.chapter .lead-text{font-size:1.05rem;max-width:none}
.lead-logo{height:76px;width:100%}
.chapter .side-img,.chapter .side-img.small{margin:0;justify-content:center}
.chapter .side-img img,.chapter .side-img.small img{height:auto;width:62%;max-width:280px;max-height:none}
.yt-quote{font-size:1.7rem}

/* photos: full width, never cropped, caption under the picture */
.photo,.story{display:flex;flex-direction:column;background:var(--void)}
.story .pic,.photo .pic{height:auto;width:100%;background:#000;padding:0}
.story .pic img,.photo .pic img{width:100%;height:auto!important;max-width:none!important;max-height:none!important;object-fit:contain!important}
.photo.whole .pic{padding:0}
.photo.whole .pic img{width:100%!important}
.ovcap,.ov .ovcap{position:static;max-width:none;text-align:left;background:transparent;border-right:0;border-left:3px solid var(--accent);margin:14px 20px 22px;padding:2px 0 2px 12px}
.ovcap .ovt{font-size:1.4rem}
.story .poster{height:auto;width:100%}
.story .poster img{width:100%;height:auto;max-width:none}
.story .poster + .pic{margin-top:6px}

/* Design Arena: chart kept readable, swipe sideways inside it */
.white .pic{display:block;background:#fff;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.white .pic::-webkit-scrollbar{display:none}
.white .pic img{width:auto!important;height:440px!important;max-width:none!important}
.pan-hint{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 20px 20px;font-family:var(--f-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:var(--dim)}
.pan-hint b{font-weight:700;color:var(--accent)}

/* press: NTV, then the two clippings */
.photo.press{width:100%;padding:0;gap:6px}
.photo.whole.press .pic{flex:none;height:auto}
.photo.whole.press .pic img{height:auto!important;object-fit:contain!important}
.photo.press .press-row{display:grid;grid-template-columns:1fr;gap:6px}
.photo.press .press-row img{height:auto}

/* banks / insurers: one card per row */
.month{display:flex;flex-direction:column;gap:16px}
.month h2,.sector header h2{font-size:clamp(3rem,15vw,4.4rem)}
.month .cols{display:grid;grid-template-columns:1fr;gap:14px}
.card.brand{padding:18px}
.card.brand .logo.big{height:76px}
.card.brand .logo.big img{max-height:54px}
.card.brand .bm{font-size:2.1rem}
.card .t{font-size:1rem}

/* logo wall: two columns */
.wall-frame{display:flex;flex-direction:column;gap:16px}
.sec-title{font-size:clamp(2.6rem,13vw,3.6rem)}
.wall{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr 1fr;grid-auto-columns:auto;gap:10px}
.wall .logo{height:88px;padding:14px 16px}
.wall .logo:last-child:nth-child(odd){grid-column:span 2}
.end{min-height:56svh;align-items:flex-start}
.end .slab{font-size:clamp(3.6rem,20vw,5.4rem)}

/* bottom bar: swipeable chips, current one in orange */
.bar{gap:0;padding-left:0;padding-right:0}
.bar > button{display:none}
.tl{overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;align-items:center}
.tl::-webkit-scrollbar{display:none}
.tl::before,.tl .fill{display:none}
.tl ol{width:max-content;justify-content:flex-start;gap:8px;padding:0 14px;align-items:center}
.tl li{flex:none}
.tl button{flex-direction:row;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;letter-spacing:.1em;color:var(--dim);background:var(--stage)}
.tl button::before{display:none}
.tl button.on{background:var(--accent);border-color:var(--accent);color:var(--void)}
.tl button.past{color:var(--ink)}
.tm{grid-row:auto!important;grid-column:auto!important}
.wall-groups{flex-direction:column;gap:28px}
.wg .wall{flex:none}
.team-grid{grid-template-rows:none!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))!important}
.team .tm .ph{aspect-ratio:4/5;flex:none}
.team{width:100%}

let last=-2;
function sync(){
  const probe=scrollY+innerHeight*0.4;
  let cur=-1;monthSecs.forEach((f,i)=>{if(frameTop(f)<=probe)cur=i});
  if(cur===last)return;last=cur;
  mBtns.forEach((b,i)=>{b.classList.toggle("on",i===cur);b.classList.toggle("past",i<cur);b.toggleAttribute("aria-current",i===cur)});
  const b=mBtns[Math.max(cur,0)];
  tl.scrollTo({left:b.offsetLeft+b.offsetWidth/2-tl.clientWidth/2,behavior:smooth()});
}

addEventListener("resize",()=>{last=-2;sync()});

<script id="autoplay">
/* Auto-advance every 3 s; any wheel, touch, click or key resets the timer, so manual scrolling always wins. */
(()=>{
  const strip=document.getElementById("strip"),DELAY=3000;
  const horiz=()=>getComputedStyle(strip).overflowX!=="visible"&&strip.scrollWidth>strip.clientWidth+5;
  let t;
  const arm=()=>{clearTimeout(t);t=setTimeout(next,DELAY)};
  function next(){
    if(document.hidden||document.querySelector(".tm.open"))return arm();
    if(horiz()){
      if(strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-4)return;
      typeof step==="function"?step(1):strip.scrollBy({left:strip.clientWidth*.85,behavior:"smooth"});
    }else{
      const y=scrollY,tops=[...strip.children].map(f=>f.getBoundingClientRect().top+scrollY);
      const n=tops.find(v=>v>y+8);
      if(n==null||y+innerHeight>=document.documentElement.scrollHeight-4)return;
      scrollTo({top:Math.min(n,y+innerHeight*.9),behavior:"smooth"});
    }
    arm();
  }
  ["wheel","touchstart","pointerdown","keydown"].forEach(e=>addEventListener(e,arm,{passive:true,capture:true}));
  arm();
})();
</script>
